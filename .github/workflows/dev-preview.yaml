name: Deploy dev preview

# Pushing to the dev branch publishes it to https://ktsierra.github.io/dev/, next to the live site.
# The build is marked noindex, and deploy.yaml leaves the dev/ folder alone when main deploys.

on:
  push:
    branches: [ dev ]
  workflow_dispatch:

permissions:
  contents: read

# Both workflows push to gh-pages, so they take turns
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /dev/
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}

      - name: Deploy to gh-pages/dev
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ github.token }}
          folder: dist
          branch: gh-pages
          target-folder: dev
          clean: true
