name: Deploy branch preview

# The redesign branch publishes into its own folder on gh-pages:
#   redesign/b-exhibit → https://ktsierra.github.io/ktsierra_portfolio/preview/b/
# The live site at the root is never touched.
# (Variant A, redesign/a-plate, was retired once B was picked; its commits are in B's history.)

on:
  push:
    branches: [redesign/b-exhibit]
  workflow_dispatch:

# One gh-pages writer at a time, so two branch pushes don't race
concurrency:
  group: gh-pages-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Pick the preview folder
        id: slot
        run: |
          case "${GITHUB_REF_NAME}" in
            redesign/b-exhibit) echo "name=b" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown branch ${GITHUB_REF_NAME}"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /ktsierra_portfolio/preview/${{ steps.slot.outputs.name }}/
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}

      - name: Deploy to gh-pages/preview/${{ steps.slot.outputs.name }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          target-folder: preview/${{ steps.slot.outputs.name }}
          clean: true
